<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
  <svg th:fragment="marca" class="marca-simbolo" viewBox="0 0 48 48" fill="none" aria-hidden="true">
    <path d="M7 11.5c5.2-1.7 11.2-1.2 17 2.5v24c-5.8-3.7-11.8-4.2-17-2.5v-24Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M41 11.5c-5.2-1.7-11.2-1.2-17 2.5v24c5.8-3.7 11.8-4.2 17-2.5v-24Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M30 6.5v13l3-2.4 3 2.4v-13" fill="currentColor" opacity=".95"/>
  </svg>

  <div th:fragment="vazio(titulo, texto, rotuloAcao, hrefAcao)" class="vazio">
    <svg viewBox="0 0 160 120" fill="none" aria-hidden="true">
      <rect x="22" y="78" width="104" height="16" rx="3" stroke="currentColor" stroke-width="2.5"/>
      <rect x="32" y="60" width="90" height="16" rx="3" stroke="currentColor" stroke-width="2.5"/>
      <path d="M44 44h66a3 3 0 0 1 3 3v11H41V47a3 3 0 0 1 3-3Z" stroke="currentColor" stroke-width="2.5"/>
      <path d="M52 86h40M60 68h28" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".5"/>
      <circle cx="124" cy="38" r="15" fill="var(--superficie)" stroke="var(--destaque)" stroke-width="3"/>
      <path d="m135 49 12 12" stroke="var(--destaque)" stroke-width="3.5" stroke-linecap="round"/>
    </svg>
    <h2 th:text="${titulo}">Nada por aqui</h2>
    <p th:text="${texto}">Descrição.</p>
    <a th:if="${rotuloAcao != null}" th:href="@{${hrefAcao}}" class="btn btn-primary" th:text="${rotuloAcao}">Ação</a>
  </div>

  <nav th:fragment="paginacao(resultado, url)" class="paginacao-b" aria-label="Paginação" th:if="${resultado.total gt 0}"
       th:with="atual=${resultado.pagina}, ultima=${resultado.totalPaginas - 1}, inicio=${T(java.lang.Math).max(0, resultado.pagina - 2)}, fim=${T(java.lang.Math).min(resultado.totalPaginas - 1, resultado.pagina + 2)}">
    <div class="tamanho">
      <span class="numero"><strong th:text="${resultado.total}">0</strong> registro(s)</span>
      <label class="sr-only" for="seletor-tamanho">Itens por página</label>
      <select id="seletor-tamanho" class="form-select form-select-sm" data-tamanho aria-label="Itens por página">
        <option th:each="n : ${T(java.util.List).of(10, 25, 50, 100)}" th:value="${n}" th:text="${n + ' por página'}" th:selected="${resultado.tamanho == n}">10</option>
        <option th:unless="${resultado.tamanho == 10 or resultado.tamanho == 25 or resultado.tamanho == 50 or resultado.tamanho == 100}" th:value="${resultado.tamanho}" th:text="${resultado.tamanho + ' por página'}" selected>12</option>
      </select>
    </div>
    <div class="paginas" th:if="${resultado.totalPaginas gt 1}">
      <a th:classappend="${atual == 0} ? 'desligado'" aria-label="Página anterior" rel="prev"
         th:href="@{${url}(pagina=${atual - 1}, tamanho=${param.tamanho}, termo=${param.termo}, tipo=${param.tipo}, status=${param.status}, categoria=${param.categoria}, disponivel=${param.disponivel}, ativo=${param.ativo}, modulo=${param.modulo}, tipoOperacao=${param.tipoOperacao}, prioridade=${param.prioridade}, lida=${param.lida}, ordenacao=${param.ordenacao})}"><i class="bi bi-chevron-left"></i></a>
      <a th:if="${inicio gt 0}" th:href="@{${url}(pagina=0, tamanho=${param.tamanho}, termo=${param.termo}, tipo=${param.tipo}, status=${param.status}, categoria=${param.categoria}, disponivel=${param.disponivel}, ativo=${param.ativo}, modulo=${param.modulo}, tipoOperacao=${param.tipoOperacao}, prioridade=${param.prioridade}, lida=${param.lida}, ordenacao=${param.ordenacao})}">1</a>
      <span th:if="${inicio gt 1}" class="reticencias">…</span>
      <a th:each="i : ${#numbers.sequence(inicio, fim)}" th:text="${i + 1}" th:classappend="${atual == i} ? 'atual'"
         th:attr="aria-current=${atual == i} ? 'page'"
         th:href="@{${url}(pagina=${i}, tamanho=${param.tamanho}, termo=${param.termo}, tipo=${param.tipo}, status=${param.status}, categoria=${param.categoria}, disponivel=${param.disponivel}, ativo=${param.ativo}, modulo=${param.modulo}, tipoOperacao=${param.tipoOperacao}, prioridade=${param.prioridade}, lida=${param.lida}, ordenacao=${param.ordenacao})}">1</a>
      <span th:if="${fim lt ultima - 1}" class="reticencias">…</span>
      <a th:if="${fim lt ultima}" th:text="${ultima + 1}"
         th:href="@{${url}(pagina=${ultima}, tamanho=${param.tamanho}, termo=${param.termo}, tipo=${param.tipo}, status=${param.status}, categoria=${param.categoria}, disponivel=${param.disponivel}, ativo=${param.ativo}, modulo=${param.modulo}, tipoOperacao=${param.tipoOperacao}, prioridade=${param.prioridade}, lida=${param.lida}, ordenacao=${param.ordenacao})}">9</a>
      <a th:classappend="${atual == ultima} ? 'desligado'" aria-label="Próxima página" rel="next"
         th:href="@{${url}(pagina=${atual + 1}, tamanho=${param.tamanho}, termo=${param.termo}, tipo=${param.tipo}, status=${param.status}, categoria=${param.categoria}, disponivel=${param.disponivel}, ativo=${param.ativo}, modulo=${param.modulo}, tipoOperacao=${param.tipoOperacao}, prioridade=${param.prioridade}, lida=${param.lida}, ordenacao=${param.ordenacao})}"><i class="bi bi-chevron-right"></i></a>
    </div>
  </nav>
</body>
</html>
