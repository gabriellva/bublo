<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="topbar">
  <header class="topbar" id="topbar">
    <div class="topbar-esquerda">
      <button type="button" class="btn-toggle-tema btn-menu" id="btn-menu" aria-label="Abrir menu">
        <i class="bi bi-list"></i>
      </button>
      <div class="titulo-app" th:text="${nomeInstituicao ?: 'Bublo'}">Bublo</div>
    </div>
    <div class="actions">
      <button type="button" class="btn-toggle-tema" id="btn-tema" title="Alternar tema" aria-label="Alternar tema">
        <i class="bi bi-moon-stars-fill"></i>
      </button>
      <div class="notificacoes-wrap">
        <button type="button" id="btn-notificacoes" class="btn-toggle-tema" title="Notificações" aria-label="Notificações">
          <i class="bi bi-bell"></i>
          <span id="contador-notificacoes" class="contador" th:text="${naoLidas ?: 0}" th:style="${(naoLidas ?: 0) gt 0} ? '' : 'display:none'">0</span>
        </button>
        <div class="dropdown-notificacoes" id="dropdown-notificacoes">
          <div class="cabecalho">Notificações</div>
          <div id="lista-notificacoes">
            <div class="item item-vazio">Carregando…</div>
          </div>
          <a class="rodape-dropdown" th:href="@{/notificacoes}">Ver todas</a>
        </div>
      </div>
      <div class="usuario">
        <i class="bi bi-person-circle"></i>
        <span th:text="${usuario ?: 'Administrador'}">Administrador</span>
      </div>
      <a class="btn-bublo btn-sm btn-contorno" th:href="@{/conta}">Minha conta</a>
      <form th:action="@{/logout}" method="post" class="form-inline">
        <button type="submit" class="btn-bublo btn-sm btn-contorno"><i class="bi bi-box-arrow-right"></i> Sair</button>
      </form>
    </div>
  </header>
</th:block>
