<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{layout/base :: head}"></th:block>
  <title>Entrar - Bublo</title>
</head>
<body class="login-container">
  <button type="button" class="btn-toggle-tema" id="btn-tema" title="Alternar tema" aria-label="Alternar tema"
          style="position:fixed;top:1rem;right:1rem;z-index:50;background:var(--bublo-superficie);">
    <i class="bi bi-moon-stars-fill"></i>
  </button>

  <div class="login-area-editorial">
    <div class="simbolo-livro"><i class="bi bi-book"></i></div>
    <h1 th:text="${nomeInstituicao ?: 'Biblioteca Acadêmica'}">Biblioteca Acadêmica</h1>
    <p class="mensagem">Sistema de gerenciamento de acervo, empréstimos e leitores. Acesso restrito ao administrador.</p>
  </div>

  <div class="login-area-form">
    <div class="login-card">
      <h2>Entrar</h2>
      <p class="subtitulo">Acesso exclusivo do administrador da biblioteca</p>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label" for="username">Usuário</label>
          <input type="text" id="username" name="username" class="form-control" autocomplete="username" autofocus required />
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Senha</label>
          <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-bublo w-100 mt-3">Entrar</button>
      </form>
      <p class="texto-ajuda mt-3 text-center">
        Credenciais configuradas pelo administrador via variáveis de ambiente.<br/>
        <small>Senhas armazenadas com BCrypt.</small>
      </p>
    </div>
  </div>

  <th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
