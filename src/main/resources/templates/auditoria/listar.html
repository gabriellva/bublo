<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app-head :: [](#~{layout/app-head}~{::head})}">
<head>
  <th:block th:replace="~{layout/app-head :: head}"></th:block>
  <title>Auditoria - Bublo</title>
</head>
<body>

  <th:block th:replace="~{layout::sidebar(modulo='configuracoes')}"></th:block>
  <th:block th:replace="~{layout::topbar}"></th:block>

  <div class="main">
    <main class="conteudo">
      <div class="page-header">
        <h1>Auditoria</h1>
        <p class="subtitulo">Registro cronológico de operações (somente leitura)</p>
      </div>

      <table class="tabela">
        <thead>
          <tr><th>#</th><th>Responsável</th><th>Operação</th><th>Módulo</th><th>Registro</th><th>Data e hora</th><th>Justificativa</th></tr>
        </thead>
        <tbody>
          <tr th:each="a : ${resultado.conteudo}">
            <td th:text="${a.id}">-</td>
            <td th:text="${a.adminUsuario}">-</td>
            <td th:text="${a.tipoOperacao}">-</td>
            <td th:text="${a.modulo}">-</td>
            <td th:text="${a.registroAfectado ?: '-'}">-</td>
            <td th:text="${#temporals.format(a.dataHora, 'dd/MM/yyyy HH:mm:ss')}">-</td>
            <td th:text="${a.justificativa ?: '-'}">-</td>
          </tr>
        </tbody>
      </table>
    </main>
  </div>
</body>
</html>
