<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{layout/base :: head}"></th:block>
  <title>Novo empréstimo - Bublo</title>
</head>
<body>
  <th:block th:replace="~{layout/sidebar :: sidebar('emprestimos')}"></th:block>

  <div class="main">
    <th:block th:replace="~{layout/topbar :: topbar}"></th:block>
    <main class="conteudo" id="conteudo" tabindex="-1">
      <div class="page-header">
        <h1>Novo empréstimo</h1>
        <p class="subtitulo">Selecione o leitor, os exemplares e a data prevista de devolução</p>
      </div>

      <form th:action="@{/emprestimos}" method="post" novalidate id="formEmprestimo" th:attr="data-prazo-aluno=${prazoAlunos}, data-prazo-professor=${prazoProfessores}">
        <div class="form-grid">
          <div>
            <label class="form-label" for="leitorId">Leitor</label>
            <select id="leitorId" name="leitorId" class="form-control" required>
              <option value="">Selecione…</option>
              <option th:each="l : ${leitores}" th:value="${l.id}" th:data-tipo="${l.tipo}"
                      th:text="${l.matricula + ' — ' + l.nome}" th:selected="${leitorId != null and leitorId == l.id}">Leitor</option>
            </select>
            <small id="statusBloqueio" class="texto-ajuda d-block" aria-live="polite"></small>
          </div>
          <div>
            <label class="form-label" for="dataPrevista">Data prevista de devolução</label>
            <input type="date" id="dataPrevista" name="dataPrevista" class="form-control" required
                   th:min="${hoje}" th:value="${dataSelecionada}" />
            <p class="texto-ajuda">Não pode passar do prazo do tipo de leitor (aluno/professor).</p>
          </div>
        </div>

        <div class="mt-3">
          <label class="form-label" for="filtroExemplares">Exemplares disponíveis</label>
          <input type="search" id="filtroExemplares" class="form-control mb-2" placeholder="Filtrar por título ou tombamento" autocomplete="off" />
          <div class="lista-selecao" role="group" aria-label="Exemplares disponíveis" id="listaExemplares">
            <label th:each="x : ${exemplaresDisponiveis}" th:attr="data-busca=${#strings.toLowerCase(x.rotulo)}">
              <input type="checkbox" name="exemplares" th:value="${x.id}"
                     th:checked="${exemplaresSelecionados != null and exemplaresSelecionados.contains(x.id)}" />
              <span th:text="${x.rotulo}">BA-000001 — Título</span>
            </label>
          </div>
          <p class="texto-ajuda" aria-live="polite"><span id="contadorSelecao">0</span> exemplar(es) selecionado(s). Somente exemplares livres aparecem aqui.</p>
          <p class="texto-ajuda" th:if="${exemplaresDisponiveis.empty}">Não há exemplares disponíveis no momento.</p>
        </div>

        <div class="acoes-linha mt-4">
          <button type="submit" class="btn-bublo" id="btnConfirmar">Confirmar empréstimo</button>
          <a th:href="@{/emprestimos}" class="btn-bublo btn-contorno">Cancelar</a>
        </div>
      </form>
    </main>
  </div>

  <th:block th:replace="~{layout/base :: scripts}"></th:block>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('formEmprestimo');
      const leitor = document.getElementById('leitorId');
      const data = document.getElementById('dataPrevista');
      const status = document.getElementById('statusBloqueio');
      const confirmar = document.getElementById('btnConfirmar');
      const filtro = document.getElementById('filtroExemplares');
      const caixas = Array.from(document.querySelectorAll('#listaExemplares input[type=checkbox]'));
      const contador = document.getElementById('contadorSelecao');
      let restricao = null;

      // Data local (toISOString usaria UTC e, à noite no Brasil, sugeriria um dia a mais).
      function dataLocal(dias) {
        const d = new Date();
        d.setDate(d.getDate() + dias);
        const dois = (n) => String(n).padStart(2, '0');
        return d.getFullYear() + '-' + dois(d.getMonth() + 1) + '-' + dois(d.getDate());
      }

      function diasDoPrazo() {
        if (restricao) return restricao.prazoDias;
        const tipo = leitor.selectedOptions[0] ? leitor.selectedOptions[0].dataset.tipo : 'ALUNO';
        return parseInt(tipo === 'PROFESSOR' ? form.dataset.prazoProfessor : form.dataset.prazoAluno, 10);
      }

      function atualizarSelecao() {
        const marcados = caixas.filter((c) => c.checked).length;
        contador.textContent = marcados;
        confirmar.disabled = !!(restricao && restricao.bloqueado);
        if (restricao && !restricao.bloqueado && restricao.ativos + marcados > restricao.limite) {
          status.textContent = 'Limite excedido: o leitor tem ' + restricao.ativos + ' ativo(s) e o limite é ' + restricao.limite + '.';
          status.style.color = 'var(--bublo-perigo)';
          confirmar.disabled = true;
        } else if (restricao && !restricao.bloqueado) {
          status.textContent = 'Sem pendências. Empréstimos ativos: ' + restricao.ativos + ' de ' + restricao.limite + '.';
          status.style.color = 'var(--bublo-sucesso)';
        }
      }

      function ajustarData() {
        data.max = dataLocal(diasDoPrazo());
        if (!data.value) data.value = dataLocal(diasDoPrazo());
      }

      function verificarRestricao() {
        status.textContent = '';
        restricao = null;
        confirmar.disabled = false;
        if (!leitor.value) return;
        ajustarData();
        fetch('/emprestimos/restricao/' + encodeURIComponent(leitor.value), { credentials: 'same-origin' })
          .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then((d) => {
            restricao = d;
            ajustarData();
            if (d.bloqueado) {
              status.textContent = 'Leitor bloqueado: possui multa pendente.';
              status.style.color = 'var(--bublo-perigo)';
              confirmar.disabled = true;
              return;
            }
            atualizarSelecao();
          })
          .catch(() => { Bublo.Toasts.atencao('Não foi possível verificar as pendências do leitor.'); });
      }

      filtro.addEventListener('input', () => {
        const termo = filtro.value.trim().toLowerCase();
        caixas.forEach((c) => { c.parentElement.hidden = termo !== '' && !c.parentElement.dataset.busca.includes(termo); });
      });
      caixas.forEach((c) => c.addEventListener('change', atualizarSelecao));
      leitor.addEventListener('change', () => { data.value = ''; verificarRestricao(); });
      verificarRestricao();
      atualizarSelecao();
    });
  </script>
</body>
</html>
