<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{layout/base :: head}"></th:block>
  <title>Acervo - Bublo</title>
</head>
<body>
  <th:block th:replace="~{layout/sidebar :: sidebar('acervo')}"></th:block>

  <div class="main">
    <th:block th:replace="~{layout/topbar :: topbar}"></th:block>
    <main class="conteudo">
      <div class="page-header cabecalho-pagina">
        <div>
          <h1>Acervo</h1>
          <p class="subtitulo">Gerencie o catálogo bibliográfico e exemplares</p>
        </div>
        <a th:href="@{/acervo/novo}" class="btn-bublo"><i class="bi bi-plus-lg"></i> Cadastrar material</a>
      </div>

      <div class="card-bublo p-3 mb-4">
        <form th:action="@{/acervo}" method="get" class="form-grid" style="align-items:end;">
          <div>
            <label class="form-label" for="termo">Buscar (título, ISBN/ISSN)</label>
            <input type="text" id="termo" name="termo" class="form-control" th:value="${termo}" />
          </div>
          <div>
            <label class="form-label" for="categoria">Categoria</label>
            <select id="categoria" name="categoria" class="form-control">
              <option value="">Todas</option>
              <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nome}" th:selected="${categoria != null and categoria == c.id}">Categoria</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="tipo">Tipo</label>
            <select id="tipo" name="tipo" class="form-control">
              <option value="">Todos</option>
              <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.label}" th:selected="${tipo != null and tipo == t}">Livro</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="disponivel">Disponibilidade</label>
            <select id="disponivel" name="disponivel" class="form-control">
              <option value="">Ambos</option>
              <option value="true" th:selected="${disponivel != null and disponivel}">Disponível</option>
              <option value="false" th:selected="${disponivel != null and !disponivel}">Indisponível</option>
            </select>
          </div>
          <div class="acoes-linha">
            <button type="submit" class="btn-bublo">Buscar</button>
            <a th:href="@{/acervo}" class="btn-bublo btn-contorno">Limpar</a>
          </div>
        </form>
      </div>

      <div class="estado-vazio" th:if="${resultado.conteudo.empty}">
        <div class="simbolo"><i class="bi bi-search"></i></div>
        <h3>Nenhum material encontrado</h3>
        <p>Tente ajustar os filtros ou cadastre um novo material.</p>
      </div>

      <div th:unless="${resultado.conteudo.empty}">
        <p class="texto-ajuda mb-3"><strong th:text="${resultado.total}">0</strong> título(s) encontrado(s)</p>
        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3">
          <div class="col" th:each="item : ${resultado.conteudo}">
            <div class="card-bublo h-100 d-flex flex-column">
              <div style="height:140px;overflow:hidden;border-radius:10px 10px 0 0;border-bottom:1px solid var(--bublo-borda);">
                <div class="capa-generica"><i class="bi bi-book"></i></div>
              </div>
              <div class="p-3 d-flex flex-column flex-grow-1">
                <span class="chip align-self-start mb-2" th:text="${item.tipo}">LIVRO</span>
                <h4 th:text="${item.titulo}" style="margin:0 0 0.4rem 0;font-size:1rem;">Título</h4>
                <div class="texto-ajuda" th:text="${item.autoresNomes.empty ? '-' : #strings.listJoin(item.autoresNomes, ', ')}">Autor</div>
                <div class="texto-ajuda" th:text="${item.categoriaNome ?: 'Sem categoria'}">Categoria</div>
                <div class="mt-2">
                  <span class="badge-bublo" th:classappend="${item.exemplaresDisponiveis > 0} ? 'badge-disponivel' : 'badge-indisponivel'"
                        th:text="${item.exemplaresDisponiveis + '/' + item.totalExemplares + ' disp.'}">1/2 disp.</span>
                </div>
                <div class="mt-auto pt-3">
                  <a th:href="@{/acervo/{id}(id=${item.id})}" class="btn-bublo btn-sm w-100">Ver detalhes</a>
                </div>
              </div>
            </div>
          </div>
        </div>
        <th:block th:replace="~{layout/componentes :: paginacao(${resultado}, '/acervo')}"></th:block>
      </div>
    </main>
  </div>

  <th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
