<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app :: shell('Registrar pagamento', 'multas', ~{::conteudo}, ~{::scripts})}">
<head><title>Pagamento</title></head>
<body>
<th:block th:fragment="conteudo">
  <div class="migalhas"><a th:href="@{/multas}">Multas</a><i class="bi bi-chevron-right small"></i><span>Pagamento</span></div>
  <div class="pagina-cabeca"><div><h1>Registrar pagamento</h1><p class="pagina-sub">Pagamento integral ou parcial, em dinheiro ou outro meio.</p></div></div>
  <div class="grade-2" style="align-items:start">
    <section class="painel">
      <div class="painel-cabeca"><h2>Multa #<span th:text="${multa.id}">1</span></h2></div>
      <div class="painel-corpo">
        <table class="tabela tabela-chave">
          <tr><th>Leitor</th><td th:text="${multa.leitorNome}">Leitor</td></tr>
          <tr><th>Valor da multa</th><td class="numero" th:text="${#numbers.formatCurrency(multa.valor)}">R$ 0,00</td></tr>
          <tr><th>Já pago</th><td class="numero" th:text="${#numbers.formatCurrency(multa.valorPago)}">R$ 0,00</td></tr>
          <tr><th>Saldo pendente</th><td class="numero"><strong class="valor-grande" th:text="${#numbers.formatCurrency(multa.saldoPendente)}">R$ 0,00</strong></td></tr>
        </table>
      </div>
    </section>
    <section class="painel">
      <div class="painel-corpo">
        <form th:action="@{/multas/{id}/pagar(id=${multa.id})}" method="post" novalidate id="form-pagamento" th:attr="data-saldo=${multa.saldoPendente}">
          <div class="segmentado mb-3" role="group" aria-label="Tipo de pagamento">
            <button type="button" class="ativo" data-modo="integral" aria-pressed="true">Pagamento integral</button>
            <button type="button" data-modo="parcial" aria-pressed="false">Pagamento parcial</button>
          </div>
          <div class="mb-3">
            <label class="form-label" for="valor">Valor a pagar (R$)</label>
            <input type="number" id="valor" name="valor" step="0.01" min="0.01" th:max="${multa.saldoPendente}" class="form-control" required th:value="${multa.saldoPendente}" readonly />
            <p class="ajuda-campo" id="ajuda-valor">O valor é o saldo pendente completo.</p>
          </div>
          <div class="mb-4">
            <label class="form-label" for="forma">Forma de pagamento</label>
            <select id="forma" name="forma" class="form-select"><option>Dinheiro</option><option>Outro meio</option></select>
          </div>
          <div class="rodape-form">
            <button type="submit" class="btn btn-primary">Confirmar pagamento</button>
            <a th:href="@{/multas}" class="btn btn-outline-secondary">Voltar</a>
          </div>
        </form>
      </div>
    </section>
  </div>
</th:block>
<th:block th:fragment="scripts"><script type="module" th:src="@{/js/pages/multas-pagar.js}"></script></th:block>
</body>
</html>
