<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{layout/base :: head}"></th:block>
  <title>Pagamento de multa - Bublo</title>
</head>
<body>
  <th:block th:replace="~{layout/sidebar :: sidebar('multas')}"></th:block>

  <div class="main">
    <th:block th:replace="~{layout/topbar :: topbar}"></th:block>
    <main class="conteudo">
      <div class="page-header">
        <h1>Pagamento de multa</h1>
        <p class="subtitulo">Registro de pagamento (dinheiro ou outro meio)</p>
      </div>

      <div class="formulario-card">
        <h3 class="mt-0">Multa #<span th:text="${multa.id}">-</span> — <span th:text="${multa.leitorNome}">Leitor</span></h3>
        <p class="texto-ajuda">Valor: <strong th:text="${#numbers.formatCurrency(multa.valor)}">R$ 0,00</strong>
          · Saldo pendente: <strong th:text="${#numbers.formatCurrency(multa.saldoPendente)}">R$ 0,00</strong></p>

        <form th:action="@{/multas/{id}/pagar(id=${multa.id})}" method="post" novalidate>
          <div class="mb-3">
            <label class="form-label" for="valor">Valor a pagar (R$)</label>
            <input type="number" id="valor" name="valor" step="0.01" min="0.01" th:max="${multa.saldoPendente}" class="form-control" required th:value="${multa.saldoPendente}" />
          </div>
          <div class="mb-3">
            <label class="form-label" for="forma">Forma de pagamento</label>
            <select id="forma" name="forma" class="form-control">
              <option>Dinheiro</option>
              <option>Outro meio</option>
            </select>
          </div>
          <div class="acoes-linha">
            <button type="submit" class="btn-bublo">Confirmar pagamento</button>
            <a th:href="@{/multas}" class="btn-bublo btn-contorno">Voltar</a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
