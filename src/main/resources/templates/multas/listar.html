<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app :: shell('Multas', 'multas', ~{::conteudo}, ~{})}">
<head><title>Multas</title></head>
<body>
<th:block th:fragment="conteudo" th:with="temFiltro=${(status != null and !#strings.isEmpty(status)) or (termo != null and !#strings.isEmpty(termo))}">
  <div class="pagina-cabeca">
    <div>
      <h1>Multas e pagamentos</h1>
      <p class="pagina-sub">Multas geradas na devolução de empréstimos em atraso. Pagamentos podem ser totais ou parciais.</p>
    </div>
  </div>

  <form th:action="@{/multas}" method="get" class="barra-ferramentas">
    <input type="hidden" name="status" th:if="${status != null and !#strings.isEmpty(status)}" th:value="${status}" />
    <div class="busca">
      <i class="bi bi-search" aria-hidden="true"></i>
      <label class="sr-only" for="termo">Buscar multas</label>
      <input type="search" id="termo" name="termo" class="form-control" th:value="${termo}" placeholder="Nome ou matrícula do leitor" />
    </div>
    <button type="submit" class="btn btn-outline-secondary">Buscar</button>
    <span class="espaco"></span>
    <nav class="segmentado" aria-label="Filtrar por situação">
      <a th:href="@{/multas(termo=${termo})}" th:classappend="${#strings.isEmpty(status)} ? 'ativo'">Todas</a>
      <a th:href="@{/multas(termo=${termo}, status='PENDENTE')}" th:classappend="${status == 'PENDENTE'} ? 'ativo'">Pendentes</a>
      <a th:href="@{/multas(termo=${termo}, status='PAGA_PARCIAL')}" th:classappend="${status == 'PAGA_PARCIAL'} ? 'ativo'">Pagas em parte</a>
      <a th:href="@{/multas(termo=${termo}, status='PAGA')}" th:classappend="${status == 'PAGA'} ? 'ativo'">Pagas</a>
    </nav>
  </form>

  <div th:if="${resultado.conteudo.empty}">
    <div th:replace="~{layout/componentes :: vazio(${temFiltro} ? 'Nenhuma multa encontrada' : 'Nenhuma multa registrada', ${temFiltro} ? 'Nada corresponde à busca ou à situação escolhida.' : 'As multas aparecem aqui quando um empréstimo em atraso é devolvido.', ${temFiltro} ? 'Limpar filtros' : null, '/multas')}"></div>
  </div>

  <div class="tabela-wrap cartoes" th:unless="${resultado.conteudo.empty}">
    <table class="tabela tabela-cartoes">
      <thead><tr><th>Nº</th><th>Leitor</th><th class="num">Atraso</th><th class="num">Valor</th><th class="num">Pago</th><th class="num">Saldo</th><th>Situação</th><th>Gerada em</th><th></th></tr></thead>
      <tbody>
        <tr th:each="m : ${resultado.conteudo}">
          <td data-rotulo="Nº" class="numero" th:text="${m.id}">1</td>
          <td data-rotulo="Leitor"><span class="principal" th:text="${m.leitorNome ?: '—'}">Leitor</span><span class="secundario" th:text="${m.leitorMatricula}">ALU-00001</span></td>
          <td data-rotulo="Atraso" class="num" th:text="${m.diasAtraso + ' dia(s)'}">3 dia(s)</td>
          <td data-rotulo="Valor" class="num" th:text="${#numbers.formatCurrency(m.valor)}">R$ 0,00</td>
          <td data-rotulo="Pago" class="num" th:text="${#numbers.formatCurrency(m.valorPago)}">R$ 0,00</td>
          <td data-rotulo="Saldo" class="num principal" th:text="${#numbers.formatCurrency(m.saldoPendente)}">R$ 0,00</td>
          <td data-rotulo="Situação"><span class="badge-b" th:classappend="${m.status == 'PAGA'} ? 'st-ok' : (${m.status == 'PAGA_PARCIAL'} ? 'st-info' : 'st-aviso')"
                th:text="${m.status == 'PAGA' ? 'Paga' : (m.status == 'PAGA_PARCIAL' ? 'Paga em parte' : 'Pendente')}">Pendente</span></td>
          <td data-rotulo="Gerada em" class="numero" th:text="${#temporals.format(m.dataGeracao, 'dd/MM/yyyy')}">01/01/2026</td>
          <td class="acoes"><a th:href="@{/multas/{id}/pagar(id=${m.id})}" class="btn btn-primary btn-sm" th:if="${m.status == 'PENDENTE' or m.status == 'PAGA_PARCIAL'}">Registrar pagamento</a></td>
        </tr>
      </tbody>
    </table>
  </div>
  <th:block th:replace="~{layout/componentes :: paginacao(${resultado}, '/multas')}"></th:block>
</th:block>
</body>
</html>
