<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{layout/base :: head}"></th:block>
  <title>Algo deu errado · Bublo</title>
</head>
<body>
  <main class="erro-pagina">
    <div class="painel cartao">
      <svg th:replace="~{layout/componentes :: marca}"></svg>
      <div class="erro-codigo mt-3" th:text="${status ?: 500}">500</div>
      <h1 class="fs-2 mt-3 mb-2" th:text="${status == 404 ? 'Página não encontrada' : (status == 403 ? 'Acesso negado' : 'Algo deu errado')}">Algo deu errado</h1>
      <p class="texto-suave" th:text="${mensagem ?: 'Ocorreu um erro inesperado. Tente novamente.'}">Mensagem.</p>
      <p class="texto-fraco small" th:if="${status == null or status >= 500}">Se o problema continuar, o banco de dados pode estar indisponível. Aguarde alguns instantes e tente de novo.</p>
      <div class="rodape-form justify-content-center mt-4">
        <button type="button" class="btn btn-primary" onclick="window.location.reload()"><i class="bi bi-arrow-clockwise"></i>Tentar novamente</button>
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary">Voltar ao início</a>
      </div>
    </div>
  </main>
  <th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
