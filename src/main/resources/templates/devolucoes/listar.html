<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app-head :: [](#~{layout/app-head}~{::head})}">
<head>
  <th:block th:replace="~{layout/app-head :: head}"></th:block>
  <title>Devoluções - Bublo</title>
</head>
<body>

  <th:block th:replace="~{layout::sidebar(modulo='devolucoes')}"></th:block>
  <th:block th:replace="~{layout::topbar}"></th:block>

  <div class="main">
    <main class="conteudo">
      <div class="page-header">
        <h1>Devoluções</h1>
        <p class="subtitulo">Registrar devolução de empréstimos ativos</p>
      </div>

      <div style="margin-bottom:1rem;">
        <label class="form-label">Buscar por tombamento, matrícula ou nome</label>
        <input type="text" name="termo" class="form-control" th:value="${termo ?: ''}" placeholder="Ex: BA-000001 ou ALU-00001" />
      </div>

      <table class="tabela">
        <thead>
          <tr><th>Empréstimo</th><th>Leitor</th><th>Material</th><th>Tombamento</th><th>Prevista</th><th>Situação</th><th>Ação</th></tr>
        </thead>
        <tbody>
          <tr th:each="e : ${resultado.conteudo}">
            <td th:text="${e.id}">-</td>
            <td th:text="${e.leitorId}">-</td>
            <td th:text="${e.id}">Material</td>
            <td>-</td>
            <td th:text="${#temporals.format(e.dataPrevistaDevolucao, 'dd/MM/yyyy')}">-</td>
            <td><span class="badge-bublo" th:class="${e.status == 'ATRASADO'} ? 'badge-atrasado' : 'badge-ativo'" th:text="${e.status}">Ativo</span></td>
            <td>
              <a th:href="@{/devolucoes/{id}(id=${e.id})}" class="btn-bublo btn-sm" style="padding:0.25rem 0.6rem;font-size:0.82rem;">Registrar devolução</a>
            </td>
          </tr>
        </tbody>
      </table>
      <div th:if="${resultado.conteudo.empty}" class="estado-vazio" style="margin-top:1rem;">
        <div class="simbolo"><i class="bi bi-box-arrow-left"></i></div>
        <h3>Sem empréstimos ativos</h3>
        <p>Não há empréstimos para devolver.</p>
      </div>
    </main>
  </div>
</body>
</html>
