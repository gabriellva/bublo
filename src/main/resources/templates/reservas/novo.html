<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app-head :: [](#~{layout/app-head}~{::head})}">
<head>
  <th:block th:replace="~{layout/app-head :: head}"></th:block>
  <title>Nova reserva - Bublo</title>
</head>
<body>

  <th:block th:replace="~{layout::sidebar(modulo='reservas')}"></th:block>
  <th:block th:replace="~{layout::topbar}"></th:block>

  <div class="main">
    <main class="conteudo">
      <div class="page-header">
        <h1>Nova reserva</h1>
        <p class="subtitulo">Reservar material indisponível</p>
      </div>

      <div th:if="${erro}" class="toast erro" style="margin-bottom:1rem;">
        <i class="bi bi-exclamation-circle-fill icone"></i>
        <div class="conteudo"><div class="titulo" th:text="${erro}">Erro</div></div>
      </div>

      <form th:action="@{/reservas}" method="post" novalidate>
        <div class="form-grid">
          <div>
            <label class="form-label">Leitor</label>
            <input type="text" name="leitor" class="form-control" required placeholder="Nome ou matrícula" />
          </div>
          <div>
            <label class="form-label">Material</label>
            <select name="item" class="form-control" required>
              <option th:each="a : ${acervo}" th:value="${a.id}" th:text="${a.titulo}">Material</option>
            </select>
          </div>
          <div>
            <label class="form-label">Prazo para retirada</label>
            <input type="date" name="prazo" class="form-control" required />
          </div>
        </div>
        <div style="display:flex;gap:0.75rem;margin-top:1.5rem;">
          <button type="submit" class="btn-bublo">Criar reserva</button>
          <a th:href="@{/reservas}" class="btn-bublo-secundario">Cancelar</a>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
