<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{layout/base :: head}"></th:block>
  <title>Leitor - Bublo</title>
</head>
<body>
  <th:block th:replace="~{layout/sidebar :: sidebar('leitores')}"></th:block>

  <div class="main">
    <th:block th:replace="~{layout/topbar :: topbar}"></th:block>
    <main class="conteudo">
      <div class="page-header">
        <h1 th:text="${leitor.id != null} ? 'Editar leitor' : 'Cadastrar leitor'">Cadastrar leitor</h1>
        <p class="subtitulo">Aluno ou professor</p>
      </div>

      <form th:action="@{/leitores}" th:object="${leitor}" method="post" novalidate>
        <input type="hidden" th:field="*{id}" />
        <div class="form-grid">
          <div>
            <label class="form-label" for="tipo">Tipo</label>
            <select th:field="*{tipo}" class="form-control" th:classappend="${#fields.hasErrors('tipo')} ? 'is-invalid'" required>
              <option value="ALUNO">Aluno</option>
              <option value="PROFESSOR">Professor</option>
            </select>
            <small class="erro-campo" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}">Erro</small>
          </div>
          <div>
            <label class="form-label" for="nome">Nome completo</label>
            <input type="text" th:field="*{nome}" class="form-control" th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'" required />
            <small class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</small>
          </div>
          <div>
            <label class="form-label" for="email">E-mail</label>
            <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" required />
            <small class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Erro</small>
          </div>
          <div>
            <label class="form-label" for="matricula">Matrícula (gerada automaticamente)</label>
            <input type="text" id="matricula" th:value="*{matricula}" class="form-control" readonly />
          </div>
          <div>
            <label class="form-label" for="cpf">CPF (opcional)</label>
            <input type="text" th:field="*{cpf}" class="form-control" placeholder="Somente se necessário" />
            <small class="erro-campo" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}">Erro</small>
          </div>
          <div>
            <label class="form-label" for="endereco">Endereço</label>
            <input type="text" th:field="*{endereco}" class="form-control" />
            <small class="erro-campo" th:if="${#fields.hasErrors('endereco')}" th:errors="*{endereco}">Erro</small>
          </div>
          <div>
            <label class="form-label" for="telefone">Telefone</label>
            <input type="text" th:field="*{telefone}" class="form-control" />
            <small class="erro-campo" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}">Erro</small>
          </div>
          <div>
            <label class="form-label" for="cursoDepartamento">Curso / Departamento</label>
            <input type="text" th:field="*{cursoDepartamento}" class="form-control" />
            <small class="erro-campo" th:if="${#fields.hasErrors('cursoDepartamento')}" th:errors="*{cursoDepartamento}">Erro</small>
          </div>
          <div>
            <label class="form-label" for="ativo">Situação</label>
            <select th:field="*{ativo}" class="form-control">
              <option value="true">Ativo</option>
              <option value="false">Inativo</option>
            </select>
          </div>
        </div>
        <div class="acoes-linha mt-4">
          <button type="submit" class="btn-bublo">Salvar leitor</button>
          <a th:href="@{/leitores}" class="btn-bublo btn-contorno">Cancelar</a>
        </div>
      </form>
    </main>
  </div>

  <th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
