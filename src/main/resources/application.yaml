spring:
  application:
    name: bublo
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false
    encoding: UTF-8
  web:
    locale: pt_BR
    locale-resolver: fixed
    resources:
      static-locations: classpath:/static/
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  messages:
    basename: messages/messages
    encoding: UTF-8

server:
  # Porta: padrão do Spring (8080); a variável SERVER_PORT, se existir, sobrepõe.
  servlet:
    session:
      cookie:
        name: BUBLO_SESSION
        http-only: true
        same-site: LAX
      timeout: 60m

# Configurações próprias do Bublo. Sem valores padrão: tudo vem das variáveis de ambiente (.env).
bublo:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
  demo:
    data:
      enabled: ${DEMO_DATA_ENABLED}

logging:
  level:
    com.gabriel.bublo: INFO
    org.springframework.web.socket: INFO
    org.flywaydb: INFO
