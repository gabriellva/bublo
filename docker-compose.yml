# Bublo - PostgreSQL via Docker Compose
# Execute: docker compose up -d
services:
  postgres:
    image: postgres:15-alpine
    container_name: bublo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bublo}
      POSTGRES_USER: ${DB_USERNAME:-bublo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bublo}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - bublo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bublo} -d ${DB_NAME:-bublo}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  bublo_postgres_data:
